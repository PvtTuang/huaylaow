<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ระบบทำนายหวยลาวพัฒนา - วิเคราะห์และทำนายผลรางวัลด้วย AI">
    <title>{% block title %}หวยลาวพัฒนา AI{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #e63946;
            --primary-dark: #b91c1c;
            --primary-light: #f87171;
            --bg-dark: #0a0a0a;
            --bg-card: #141414;
            --bg-card2: #1e1e1e;
            --accent: #ffffff;
            --accent2: #a3a3a3;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --text: #ffffff;
            --text-muted: #a3a3a3;
            --border: rgba(255, 255, 255, 0.1);
            --glow: rgba(230, 57, 70, 0.4);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Sarabun', sans-serif;
            background: var(--bg-dark);
            color: var(--text);
            min-height: 100vh;
            background-image:
                radial-gradient(ellipse at 20% 20%, rgba(230, 57, 70, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(255, 255, 255, 0.03) 0%, transparent 50%);
        }

        /* NAV */
        nav {
            background: rgba(18,18,31,0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 0 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .nav-inner {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 64px;
        }
        .nav-brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
        }
        .nav-logo {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }
        .nav-title {
            font-size: 1.1rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .nav-links {
            display: flex;
            gap: 0.5rem;
            list-style: none;
        }
        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            transition: all 0.2s;
            font-weight: 500;
        }
        .nav-links a:hover, .nav-links a.active {
            color: var(--primary);
            background: rgba(200,169,78,0.1);
        }

        /* MAIN */
        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
        }

        /* CARDS */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.5rem;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .card:hover {
            border-color: rgba(200,169,78,0.3);
            box-shadow: 0 0 30px rgba(200,169,78,0.05);
        }
        .card-title {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 0.75rem;
        }

        /* LOTTERY NUMBER DISPLAY */
        .lottery-number {
            display: inline-flex;
            gap: 6px;
        }
        .digit-box {
            width: 52px;
            height: 64px;
            background: linear-gradient(145deg, var(--bg-card2), rgba(255,255,255,0.02));
            border: 1.5px solid rgba(255,255,255,0.2);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--text);
            box-shadow: 0 0 15px rgba(255,255,255,0.05), inset 0 1px 0 rgba(255,255,255,0.05);
            animation: digitGlow 3s ease-in-out infinite;
        }
        @keyframes digitGlow {
            0%, 100% { box-shadow: 0 0 10px rgba(255,255,255,0.05); }
            50% { box-shadow: 0 0 25px rgba(255,255,255,0.15); }
        }
        .digit-box.predict {
            border-color: rgba(230,57,70,0.6);
            color: var(--primary-light);
            animation: predictGlow 2s ease-in-out infinite;
        }
        @keyframes predictGlow {
            0%, 100% { box-shadow: 0 0 10px rgba(230,57,70,0.15); }
            50% { box-shadow: 0 0 25px rgba(230,57,70,0.3); }
        }

        /* BADGE */
        .badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .badge-gold {
            background: rgba(255,255,255,0.1);
            color: var(--text);
            border: 1px solid rgba(255,255,255,0.2);
        }
        .badge-purple {
            background: rgba(230,57,70,0.15);
            color: var(--primary-light);
            border: 1px solid rgba(230,57,70,0.3);
        }
        .badge-success {
            background: rgba(16,185,129,0.15);
            color: var(--success);
            border: 1px solid rgba(16,185,129,0.3);
        }
        .badge-danger {
            background: rgba(239,68,68,0.15);
            color: var(--danger);
            border: 1px solid rgba(239,68,68,0.3);
        }

        /* BUTTONS */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.6rem 1.25rem;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.2s;
            text-decoration: none;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #000;
        }
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(200,169,78,0.4);
        }
        .btn-outline {
            background: transparent;
            color: var(--primary);
            border: 1px solid var(--border);
        }
        .btn-outline:hover {
            background: rgba(200,169,78,0.1);
            border-color: var(--primary);
        }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }

        /* GRID */
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1.5rem; }
        .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; }

        /* TABLE */
        table { width: 100%; border-collapse: collapse; }
        th {
            text-align: left;
            padding: 0.75rem 1rem;
            color: var(--text-muted);
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-bottom: 1px solid var(--border);
        }
        td {
            padding: 0.85rem 1rem;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            font-size: 0.95rem;
        }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: rgba(200,169,78,0.03); }

        /* STAT BOX */
        .stat-box { text-align: center; }
        .stat-value {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .stat-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 0.25rem;
        }

        /* PROGRESS BAR */
        .progress {
            background: rgba(255,255,255,0.06);
            border-radius: 999px;
            height: 6px;
            overflow: hidden;
            margin-top: 0.5rem;
        }
        .progress-bar {
            height: 100%;
            border-radius: 999px;
            background: linear-gradient(90deg, var(--accent), var(--primary));
            transition: width 1s ease;
        }

        /* HOT NUMBER */
        .hot-num {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .hot-circle {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-dark), var(--primary));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            font-weight: 800;
            color: #000;
        }
        .hot-count {
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        /* TOAST */
        .toast-container {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            z-index: 999;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .toast {
            padding: 0.9rem 1.25rem;
            border-radius: 12px;
            color: white;
            font-size: 0.9rem;
            font-weight: 500;
            animation: slideIn 0.3s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .toast-success { background: linear-gradient(135deg, #059669, #10b981); }
        .toast-error { background: linear-gradient(135deg, #b91c1c, #ef4444); }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* LOADING SPINNER */
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(0,0,0,0.3);
            border-top-color: #000;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* DIVIDER */
        .divider {
            border: none;
            border-top: 1px solid var(--border);
            margin: 1.5rem 0;
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
            .digit-box { width: 40px; height: 50px; font-size: 1.4rem; }
            nav { padding: 0 1rem; }
            main { padding: 1rem; }
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <nav>
        <div class="nav-inner">
            <a href="/" class="nav-brand">
                <div class="nav-logo">🎰</div>
                <span class="nav-title">หวยลาวพัฒนา AI</span>
            </a>
            <ul class="nav-links">
                <li><a href="/" id="nav-dashboard" class="{% block nav_dashboard %}{% endblock %}">🏠 หน้าหลัก</a></li>
                <li><a href="/history/" id="nav-history" class="{% block nav_history %}{% endblock %}">📊 ประวัติ</a></li>
                <li><a href="/admin/" target="_blank">⚙️ Admin</a></li>
            </ul>
        </div>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    <div class="toast-container" id="toastContainer"></div>

    <script>
        function showToast(msg, type='success') {
            const el = document.createElement('div');
            el.className = `toast toast-${type}`;
            el.textContent = msg;
            document.getElementById('toastContainer').appendChild(el);
            setTimeout(() => el.remove(), 3500);
        }

        function csrfToken() {
            return document.cookie.split(';')
                .find(c => c.trim().startsWith('csrftoken='))
                ?.split('=')[1] || '';
        }
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
