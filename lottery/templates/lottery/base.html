<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ระบบทำนายหวยลาวพัฒนา - วิเคราะห์และทำนายผลรางวัลด้วย AI">
    <title>{% block title %}หวยลาวพัฒนา AI{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #e63946;
            --primary-dark: #b91c1c;
            --primary-light: #f87171;
            --bg-body: #230808;
            --bg-card: #e2e8f0; /* Light gray */
            --bg-box: #cbd5e1; /* Slightly darker gray for inner boxes */
            --text-body: #fef2f2;
            --text-card: #1e293b; /* Dark slate text */
            --text-muted: #475569; /* Darker muted text for readability */
            --border: #94a3b8;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Sarabun', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-body);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* NAV */
        nav {
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow-sm);
        }
        .nav-inner {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 64px;
            padding: 0 2rem;
        }
        .nav-brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
        }
        .nav-logo {
            width: 36px;
            height: 36px;
            background-color: var(--primary);
            color: #ffffff;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            font-weight: bold;
        }
        .nav-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-card);
            letter-spacing: -0.02em;
        }
        .nav-links {
            display: flex;
            gap: 0.5rem;
            list-style: none;
        }
        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            transition: all 0.2s;
            font-weight: 600;
            font-size: 0.95rem;
        }
        .nav-links a:hover, .nav-links a.active {
            color: var(--primary);
            background-color: rgba(230, 57, 70, 0.08);
        }

        /* MAIN */
        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* CARDS */
        .card {
            background-color: var(--bg-card);
            color: var(--text-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: var(--shadow-sm);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .card-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 1rem;
        }

        /* LOTTERY NUMBER DISPLAY */
        .lottery-number {
            display: inline-flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .digit-box {
            width: 50px;
            height: 60px;
            background-color: var(--bg-box);
            border: 1px solid var(--border);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-card);
            box-shadow: var(--shadow-sm);
        }
        .digit-box.predict {
            border-color: var(--primary);
            color: var(--primary);
            background-color: rgba(230, 57, 70, 0.03);
        }

        /* BADGE */
        .badge {
            display: inline-block;
            padding: 0.35rem 0.85rem;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.02em;
        }
        .badge-light {
            background-color: var(--bg-box);
            color: var(--text-card);
            border: 1px solid var(--border);
        }
        .badge-red {
            background-color: rgba(230, 57, 70, 0.1);
            color: var(--primary);
            border: 1px solid rgba(230, 57, 70, 0.2);
        }

        /* BUTTONS */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 600;
            transition: all 0.2s;
            text-decoration: none;
        }
        .btn-primary {
            background-color: var(--primary);
            color: #ffffff;
            box-shadow: var(--shadow-sm);
        }
        .btn-primary:hover {
            background-color: var(--primary-dark);
            transform: translateY(-1px);
        }
        .btn-outline {
            background-color: transparent;
            color: var(--text-card);
            border: 1px solid var(--border);
        }
        .btn-outline:hover {
            background-color: var(--bg-box);
        }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none !important; }

        /* GRID */
        .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.5rem; }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem; }

        /* TABLE */
        .table-wrapper {
            overflow-x: auto;
            border: 1px solid var(--border);
            border-radius: 8px;
        }
        table { width: 100%; border-collapse: collapse; background-color: var(--bg-card); }
        th {
            text-align: left;
            padding: 1rem;
            color: var(--text-muted);
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            border-bottom: 1px solid var(--border);
            background-color: var(--bg-box);
            white-space: nowrap;
        }
        td {
            padding: 1rem;
            border-bottom: 1px solid var(--border);
            font-size: 0.95rem;
            font-weight: 500;
            white-space: nowrap;
        }
        tr:last-child td { border-bottom: none; }

        /* PROGRESS BAR */
        .progress {
            background-color: var(--border);
            border-radius: 999px;
            height: 8px;
            overflow: hidden;
            margin-top: 0.5rem;
        }
        .progress-bar {
            height: 100%;
            border-radius: 999px;
            background-color: var(--primary);
            transition: width 1s ease;
        }

        /* HOT NUMBER */
        .hot-num {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        .hot-circle {
            width: 44px;
            height: 44px;
            border-radius: 8px;
            background-color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: 700;
            color: #ffffff;
            box-shadow: var(--shadow-sm);
        }
        .hot-count {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        /* TOAST */
        .toast-container {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            z-index: 999;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        .toast {
            padding: 1rem 1.5rem;
            border-radius: 8px;
            color: white;
            font-size: 0.95rem;
            font-weight: 500;
            animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: var(--shadow-lg);
        }
        .toast-success { background-color: var(--success); }
        .toast-error { background-color: var(--danger); }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .nav-inner { padding: 0 1rem; }
            main { padding: 1rem; }
            .grid-2, .grid-3 { grid-template-columns: 1fr; gap: 1rem; }
            .digit-box { width: 42px; height: 50px; font-size: 1.4rem; }
            .hero { padding: 2rem 0 1rem; }
            .hero-title { font-size: 2rem; }
            .card { padding: 1.25rem; }
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <nav>
        <div class="nav-inner">
            <a href="/" class="nav-brand">
                <div class="nav-logo">H</div>
                <span class="nav-title">หวยลาวพัฒนา</span>
            </a>
            <ul class="nav-links">
                <li><a href="/" id="nav-dashboard" class="{% block nav_dashboard %}{% endblock %}">หน้าหลัก</a></li>
                <li><a href="/history/" id="nav-history" class="{% block nav_history %}{% endblock %}">สถิติย้อนหลัง</a></li>
            </ul>
        </div>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    <div class="toast-container" id="toastContainer"></div>

    <script>
        function showToast(msg, type='success') {
            const el = document.createElement('div');
            el.className = `toast toast-${type}`;
            el.textContent = msg;
            document.getElementById('toastContainer').appendChild(el);
            setTimeout(() => el.remove(), 3500);
        }

        function csrfToken() {
            return document.cookie.split(';')
                .find(c => c.trim().startsWith('csrftoken='))
                ?.split('=')[1] || '';
        }
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
